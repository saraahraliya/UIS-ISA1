<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" style="width:100%;max-width:460px;justify-self:center" fill="none" role="img" aria-label="Topic cards dropping into a learning bag"><style>.cd{transform-box:fill-box;transform-origin:center;animation:drop 9s ease-in infinite both}@keyframes drop{0%{transform:translateY(-24px);opacity:0}8%{transform:translateY(0);opacity:1}30%{transform:translateY(0)}48%{transform:translateY(150px) scale(.55);opacity:1}58%,100%{transform:translateY(150px) scale(.55);opacity:0}}.sw{transform-box:fill-box;transform-origin:50% 100%;animation:swy 3s ease-in-out infinite}@keyframes swy{50%{transform:rotate(1.6deg) scaleY(.99)}}</style><rect x="10" y="10" width="400" height="320" rx="44" fill="#F0EAFF"/><g class="sw"><path d="M130 205h160l16 100a12 12 0 01-12 12H126a12 12 0 01-12-12z" fill="#fff" stroke="#6B43D6" stroke-width="2.5"/><path d="M170 205v-16a40 40 0 0180 0v16" stroke="#6B43D6" stroke-width="2.5"/><rect x="150" y="250" width="120" height="6" rx="3" fill="#E2D8F5"/></g><g transform="translate(155 40) rotate(-6 55 26)"><g class="cd" style="animation-delay:0s"><rect width="110" height="52" rx="12" fill="#fff" stroke="#E2D8F5"/><rect x="14" y="14" width="34" height="6" rx="3" fill="#6B43D6"/><text x="14" y="38" font-family="DM Mono, monospace" font-size="12" fill="#171717">Typography</text></g></g><g transform="translate(160 40) rotate(4 55 26)"><g class="cd" style="animation-delay:3s"><rect width="110" height="52" rx="12" fill="#fff" stroke="#E2D8F5"/><rect x="14" y="14" width="34" height="6" rx="3" fill="#405CFF"/><text x="14" y="38" font-family="DM Mono, monospace" font-size="12" fill="#171717">Coding</text></g></g><g transform="translate(150 40) rotate(-2 55 26)"><g class="cd" style="animation-delay:6s"><rect width="110" height="52" rx="12" fill="#fff" stroke="#E2D8F5"/><rect x="14" y="14" width="34" height="6" rx="3" fill="#6B43D6"/><text x="14" y="38" font-family="DM Mono, monospace" font-size="12" fill="#171717">Photography</text></g></g><text x="210" y="312" text-anchor="middle" font-family="DM Mono, monospace" font-size="11" fill="#777" style="letter-spacing:.12em">PICK → BAG → WEIGH</text></svg>
